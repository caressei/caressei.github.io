<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的第一个网站</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f5f7fa;
      color: #22303f;
      line-height: 1.75;
      padding: 24px 18px 60px;
    }
    .wrap { max-width: 620px; margin: 0 auto; }
    header {
      background: linear-gradient(135deg, #4f7cff, #7c4dff);
      color: #fff;
      border-radius: 18px;
      padding: 32px 24px;
      margin-bottom: 22px;
    }
    header h1 { font-size: 26px; margin-bottom: 6px; }
    header p { opacity: .9; font-size: 15px; }
    section {
      background: #fff;
      border-radius: 16px;
      padding: 22px 20px;
      margin-bottom: 18px;
      box-shadow: 0 2px 10px rgba(30, 50, 90, .06);
    }
    h2 { font-size: 18px; margin-bottom: 12px; color: #2b3a4f; }
    ul { padding-left: 20px; }
    li { margin-bottom: 8px; }
    a { color: #4f7cff; }
    .btn {
      display: inline-block;
      margin-top: 10px;
      background: #4f7cff;
      color: #fff;
      text-decoration: none;
      padding: 11px 22px;
      border-radius: 10px;
      font-size: 15px;
    }
    footer { text-align: center; font-size: 13px; color: #8b98a8; margin-top: 26px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>你好，这里是我的网站 👋</h1>
      <p>它托管在 GitHub Pages 上，任何人打开网址都能看到。</p>
    </header>

    <section>
      <h2>这个网站能做什么</h2>
      <ul>
        <li>免费、公开、有独立网址</li>
        <li>改完文件提交一次，几十秒后自动更新</li>
        <li>可以放作品、笔记、简历、下载链接</li>
      </ul>
      <a class="btn" href="https://github.com" target="_blank" rel="noopener">去 GitHub 看看</a>
    </section>

    <section>
      <h2>怎么改内容</h2>
      <ul>
        <li>把 <strong>你好，这里是我的网站</strong> 换成你的标题</li>
        <li>把上面三行列表换成你想写的内容</li>
        <li>保存并提交（Commit），等一分钟刷新页面</li>
      </ul>
    </section>

    <footer>© 2026 我的小站 · 用 GitHub Pages 搭建</footer>
  </div>
</body>
</html>
