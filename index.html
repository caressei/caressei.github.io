<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#ffffff">
<title>图片藏 ZIP</title>
<meta name="description" content="把 zip 塞进图片里，图片照常显示，文件随时取回。单 HTML、纯前端。">
<style>
  :root{
    --ink:#111827;
    --text:#374151;
    --muted:#6b7280;
    --line:#e5e7eb;
    --soft:#f3f4f6;
    --brand:#2563eb;
    --brand-soft:#eff6ff;
    --ok:#059669;
    --err:#dc2626;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0;
    background:#fff;
    color:var(--text);
    font-family:-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
    font-size:14px;
    line-height:1.6;
    -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:540px;margin:0 auto;padding:34px 20px 48px}
  header{text-align:center;margin-bottom:26px}
  h1{
    margin:0 0 8px;
    font-size:28px;
    font-weight:800;
    letter-spacing:-.4px;
    color:var(--ink);
    line-height:1.3;
  }
  .sub{margin:0;font-size:14px;color:var(--muted)}
  .tabs{
    display:flex;
    gap:4px;
    padding:4px;
    background:var(--soft);
    border-radius:12px;
    margin-bottom:16px;
  }
  .tab{
    flex:1;
    appearance:none;
    border:0;
    background:transparent;
    color:var(--muted);
    font:inherit;
    font-size:14px;
    font-weight:600;
    padding:9px 6px;
    border-radius:9px;
    cursor:pointer;
    transition:.15s;
  }
  .tab.active{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.09)}
  .panel{display:none}
  .panel.active{display:block;animation:fade .18s ease}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .pick{
    display:flex;
    align-items:center;
    gap:14px;
    padding:15px 16px;
    border:1.5px dashed var(--line);
    border-radius:14px;
    background:#fff;
    cursor:pointer;
    transition:.15s;
    margin-bottom:10px;
  }
  .pick:active{transform:scale(.995)}
  .pick.ready{border-style:solid;border-color:#bfdbfe;background:var(--brand-soft)}
  .pick-ico{font-size:23px;line-height:1;flex:0 0 auto}
  .pick-main{flex:1;min-width:0}
  .pick-title{font-size:14px;font-weight:600;color:var(--ink);margin-bottom:1px}
  .pick-sub{
    font-size:12px;
    color:var(--muted);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .pick-state{flex:0 0 auto;font-size:12px;font-weight:600;color:var(--ok);max-width:40%;text-align:right}
  .btn{
    display:block;
    width:100%;
    appearance:none;
    border:1px solid var(--line);
    border-radius:12px;
    background:#fff;
    color:var(--ink);
    font:inherit;
    font-size:15px;
    font-weight:600;
    padding:13px;
    cursor:pointer;
    transition:.15s;
  }
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn.primary:active{background:#1d4ed8}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .status{
    min-height:18px;
    padding:7px 0 2px;
    font-size:13px;
    color:var(--muted);
    text-align:center;
    word-break:break-all;
  }
  .status.ok{color:var(--ok)}
  .status.err{color:var(--err)}
  .status.warn{color:#b45309}
  .result{
    margin-top:16px;
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px;
    background:#fff;
    animation:fade .18s ease;
  }
  .result img{
    width:100%;
    max-height:220px;
    object-fit:contain;
    border-radius:10px;
    background:#f9fafb;
    display:block;
  }
  .meta{margin-top:12px;font-size:13px;color:var(--text);word-break:break-word}
  .name{
    margin-top:4px;
    font-size:12px;
    color:var(--muted);
    word-break:break-all;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  .hint{margin-top:8px;font-size:12px;color:var(--muted)}
  .result .btn{margin-top:12px}
  .foot{
    margin-top:32px;
    text-align:center;
    font-size:12px;
    color:#9ca3af;
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>图片藏 ZIP</h1>
      <p class="sub">把 zip 塞进图片里，图片照常显示，文件随时取回</p>
    </header>

    <div class="tabs" role="tablist">
      <button class="tab active" data-tab="embed" type="button" role="tab">合成图片</button>
      <button class="tab" data-tab="extract" type="button" role="tab">提取文件</button>
    </div>

    <section class="panel active" id="panel-embed">
      <label class="pick" for="imgInput" id="imgPick">
        <input type="file" id="imgInput" accept="image/*" hidden>
        <div class="pick-ico">🖼️</div>
        <div class="pick-main">
          <div class="pick-title">选择图片</div>
          <div class="pick-sub" id="imgSub">JPG / PNG / GIF / WebP</div>
        </div>
        <div class="pick-state" id="imgState"></div>
      </label>

      <label class="pick" for="zipInput" id="zipPick">
        <input type="file" id="zipInput" hidden>
        <div class="pick-ico">🗜️</div>
        <div class="pick-main">
          <div class="pick-title">选择 ZIP</div>
          <div class="pick-sub" id="zipSub">.zip / .apk / .jar / .epub 都可以</div>
        </div>
        <div class="pick-state" id="zipState"></div>
      </label>

      <button class="btn primary" id="buildBtn" type="button" disabled>生成图片</button>
      <div class="status" id="embedStatus"></div>

      <div class="result" id="embedResult" hidden>
        <img id="outPreview" alt="输出图片预览">
        <div class="meta" id="outMeta"></div>
        <div class="name" id="outName"></div>
        <div class="hint" id="renderHint"></div>
        <button class="btn primary" id="downloadBtn" type="button">下载图片</button>
      </div>
    </section>

    <section class="panel" id="panel-extract">
      <label class="pick" for="srcInput" id="srcPick">
        <input type="file" id="srcInput" accept="image/*" hidden>
        <div class="pick-ico">🔍</div>
        <div class="pick-main">
          <div class="pick-title">选择图片</div>
          <div class="pick-sub" id="srcSub">选合成过的图片，自动找出里面的 ZIP</div>
        </div>
        <div class="pick-state" id="srcState"></div>
      </label>

      <button class="btn primary" id="extractBtn" type="button" disabled>提取 ZIP</button>
      <div class="status" id="extractStatus"></div>

      <div class="result" id="extractResult" hidden>
        <img id="srcPreview" alt="图片预览">
        <div class="meta" id="extractMeta"></div>
        <div class="name" id="extractName"></div>
        <button class="btn primary" id="saveZipBtn" type="button">下载 ZIP</button>
      </div>
    </section>

    <div class="foot">纯本地处理 · 文件不会上传 · 单个 HTML 文件</div>
  </div>

<script>
(function () {
  'use strict';

  var $ = function (sel, root) { return (root || document).querySelector(sel); };
  var $$ = function (sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); };

  var UNITS = ['B', 'KB', 'MB', 'GB', 'TB'];

  function fmt(n) {
    var i = 0, v = n;
    while (v >= 1024 && i < UNITS.length - 1) { v /= 1024; i++; }
    return (i === 0 ? String(v) : v.toFixed(v < 10 ? 2 : 1)) + ' ' + UNITS[i];
  }

  function basename(name) {
    var i = name.lastIndexOf('.');
    return i > 0 ? name.slice(0, i) : name;
  }

  function extOf(name, fallback) {
    var i = name.lastIndexOf('.');
    return (i > 0 && i < name.length - 1) ? name.slice(i + 1).toLowerCase() : fallback;
  }

  function sniffImage(u8) {
    if (u8.length < 12) return null;
    if (u8[0] === 0x89 && u8[1] === 0x50 && u8[2] === 0x4e && u8[3] === 0x47) return { ext: 'png', mime: 'image/png' };
    if (u8[0] === 0xff && u8[1] === 0xd8 && u8[2] === 0xff) return { ext: 'jpg', mime: 'image/jpeg' };
    if (u8[0] === 0x47 && u8[1] === 0x49 && u8[2] === 0x46) return { ext: 'gif', mime: 'image/gif' };
    if (u8[0] === 0x42 && u8[1] === 0x4d) return { ext: 'bmp', mime: 'image/bmp' };
    if (u8[0] === 0x52 && u8[1] === 0x49 && u8[2] === 0x46 && u8[3] === 0x46 &&
        u8[8] === 0x57 && u8[9] === 0x45 && u8[10] === 0x42 && u8[11] === 0x50) return { ext: 'webp', mime: 'image/webp' };
    if (u8[0] === 0x66 && u8[1] === 0x74 && u8[2] === 0x79 && u8[3] === 0x70) return { ext: 'avif', mime: 'image/avif' };
    return null;
  }

  function download(blob, name) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = name;
    a.rel = 'noopener';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
  }

  function setStatus(el, text, cls) {
    el.textContent = text || '';
    el.className = 'status' + (cls ? ' ' + cls : '');
  }

  // 标签页
  $$('.tab').forEach(function (tab) {
    tab.addEventListener('click', function () {
      $$('.tab').forEach(function (t) { t.classList.toggle('active', t === tab); });
      $$('.panel').forEach(function (p) { p.classList.toggle('active', p.id === 'panel-' + tab.dataset.tab); });
    });
  });

  // 桌面端拖拽（手机端无副作用）
  document.addEventListener('dragover', function (e) { e.preventDefault(); });
  document.addEventListener('drop', function (e) { e.preventDefault(); });

  // ---------- 合成 ----------
  var embed = { img: null, zip: null, blob: null, outName: '' };

  function markPick(pickEl, stateEl, file) {
    if (!file) {
      pickEl.classList.remove('ready');
      stateEl.textContent = '';
      return;
    }
    pickEl.classList.add('ready');
    stateEl.textContent = '✓ ' + fmt(file.size);
  }

  function refreshBuildBtn() {
    $('#buildBtn').disabled = !(embed.img && embed.zip);
  }

  $('#imgInput').addEventListener('change', function (e) {
    var f = e.target.files && e.target.files[0];
    if (!f) return;
    e.target.value = '';
    embed.img = f;
    $('#imgSub').textContent = f.name;
    markPick($('#imgPick'), $('#imgState'), f);
    $('#embedResult').hidden = true;
    setStatus($('#embedStatus'), '');
    refreshBuildBtn();
  });

  $('#zipInput').addEventListener('change', function (e) {
    var f = e.target.files && e.target.files[0];
    if (!f) return;
    e.target.value = '';
    embed.zip = f;
    $('#zipSub').textContent = f.name;
    markPick($('#zipPick'), $('#zipState'), f);
    $('#embedResult').hidden = true;
    setStatus($('#embedStatus'), '');
    refreshBuildBtn();
  });

  $('#buildBtn').addEventListener('click', build);

  async function build() {
    var im = embed.img, zf = embed.zip;
    if (!im || !zf) return;

    var btn = $('#buildBtn');
    var st = $('#embedStatus');
    btn.disabled = true;
    setStatus(st, '正在合成…');

    try {
      var headBytes = new Uint8Array(await im.slice(0, 12).arrayBuffer());
      var kind = sniffImage(headBytes);
      var mime = (im.type && im.type.indexOf('image/') === 0) ? im.type : (kind ? kind.mime : 'application/octet-stream');
      var ext = kind ? kind.ext : extOf(im.name, 'jpg');

      // Blob 多段拼接：图片字节 + zip 字节
      var blob = new Blob([im, zf], { type: mime });

      // 校验：zip 首字节确实落在图片长度处
      var probe = new Uint8Array(await blob.slice(im.size, im.size + 4).arrayBuffer());
      var zhead = new Uint8Array(await zf.slice(0, 4).arrayBuffer());
      var same = probe.length === zhead.length;
      for (var i = 0; same && i < probe.length; i++) {
        if (probe[i] !== zhead[i]) same = false;
      }
      if (!same) throw new Error('校验未通过，请重试');

      embed.blob = blob;
      embed.outName = basename(im.name) + '_zip.' + ext;

      var prev = $('#outPreview');
      if (prev.dataset.url) URL.revokeObjectURL(prev.dataset.url);
      var url = URL.createObjectURL(blob);
      prev.dataset.url = url;
      prev.onload = function () {
        $('#renderHint').textContent = '✅ 图片本身可正常显示';
      };
      prev.onerror = function () {
        $('#renderHint').textContent = '⚠️ 预览异常，可能不是标准图片，文件仍然生成了';
      };
      prev.src = url;

      $('#outMeta').textContent =
        '图片 ' + fmt(im.size) + ' + ZIP ' + fmt(zf.size) + ' = ' + fmt(blob.size) +
        '（ZIP 起点：第 ' + im.size.toLocaleString() + ' 字节）';
      $('#outName').textContent = '文件名：' + embed.outName;
      $('#embedResult').hidden = false;
      setStatus(st, '合成完成，点击下方按钮下载', 'ok');
    } catch (err) {
      setStatus(st, '出错：' + (err && err.message ? err.message : err), 'err');
    } finally {
      btn.disabled = false;
    }
  }

  $('#downloadBtn').addEventListener('click', function () {
    if (embed.blob) download(embed.blob, embed.outName);
  });

  // ---------- 提取 ----------
  var ex = { file: null, blob: null, name: '' };

  $('#srcInput').addEventListener('change', function (e) {
    var f = e.target.files && e.target.files[0];
    if (!f) return;
    e.target.value = '';
    ex.file = f;
    $('#srcSub').textContent = f.name;
    markPick($('#srcPick'), $('#srcState'), f);
    $('#extractBtn').disabled = false;
    $('#extractResult').hidden = true;
    setStatus($('#extractStatus'), '');

    var prev = $('#srcPreview');
    if (prev.dataset.url) URL.revokeObjectURL(prev.dataset.url);
    var url = URL.createObjectURL(f);
    prev.dataset.url = url;
    prev.src = url;
  });

  $('#extractBtn').addEventListener('click', extract);

  // 定位 zip 起点：优先由 EOCD 反推，失败再正向找 local file header
  function locateZip(buf) {
    var n = buf.length;
    if (n < 4) return -1;

    // EOCD 位于文件最后 65557 字节内（注释最长 65535）
    var tailStart = Math.max(0, n - 65558);
    for (var i = n - 22; i >= tailStart; i--) {
      if (buf[i] === 0x50 && buf[i + 1] === 0x4b && buf[i + 2] === 0x05 && buf[i + 3] === 0x06) {
        var dv = new DataView(buf.buffer, buf.byteOffset + i, 22);
        var cdSize = dv.getUint32(12, true);
        var cdOffset = dv.getUint32(16, true);
        var start = i - cdSize - cdOffset;
        if (start >= 0 && start + 2 <= n && buf[start] === 0x50 && buf[start + 1] === 0x4b) return start;
      }
    }

    for (var j = 0; j + 4 <= n; j++) {
      if (buf[j] === 0x50 && buf[j + 1] === 0x4b && buf[j + 2] === 0x03 && buf[j + 3] === 0x04) return j;
    }
    return -1;
  }

  async function extract() {
    var f = ex.file;
    if (!f) return;

    var btn = $('#extractBtn');
    var st = $('#extractStatus');
    btn.disabled = true;
    setStatus(st, '正在扫描…');

    try {
      var buf = new Uint8Array(await f.arrayBuffer());
      var start = locateZip(buf);
      if (start < 0) {
        setStatus(st, '没找到 ZIP 数据，确认下这张图是不是这里合成的', 'err');
        return;
      }

      var data = buf.subarray(start);
      ex.blob = new Blob([data], { type: 'application/zip' });
      ex.name = basename(f.name) + '.zip';

      $('#extractMeta').textContent =
        '找到 ZIP：第 ' + start.toLocaleString() + ' 字节起，共 ' + fmt(data.length) +
        '（图片共 ' + fmt(f.size) + '）';
      $('#extractName').textContent = '文件名：' + ex.name;
      $('#extractResult').hidden = false;
      setStatus(st, '找到 ZIP 了，点击下方按钮保存', 'ok');
    } catch (err) {
      setStatus(st, '出错：' + (err && err.message ? err.message : err), 'err');
    } finally {
      btn.disabled = false;
    }
  }

  $('#saveZipBtn').addEventListener('click', function () {
    if (ex.blob) download(ex.blob, ex.name);
  });
})();
</script>
</body>
</html>
